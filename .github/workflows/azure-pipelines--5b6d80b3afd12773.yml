name: azure-pipelines
on:
  workflow_dispatch:
    inputs:
      environments:
        description: environments
        type: string
        default: '["dev", "prod"]'
        required: false
      deploy:
        description: deploy
        type: boolean
        default: true
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CONFIGURATION: Release
  REGION: ${{ vars.REGION }}
  DOTNETVERSION: 8.0.x
  ISMAIN: 'true'
jobs:
  Build_Compile:
    runs-on: ${{ matrix.image }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - leg: linux
          image: ubuntu-latest
        - leg: windows
          image: windows-latest
    env:
      IMAGE: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: UseDotNet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build src/Api/Api.csproj
      run: dotnet build src/Api/Api.csproj -c Release
    - name: Build src/Worker/Worker.csproj
      run: dotnet build src/Worker/Worker.csproj -c Release
    - run: dotnet test --collect "Code coverage" --logger trx --results-directory "${{ runner.temp }}/TestResults"
    - name: dotnet test results
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v1
      with:
        name: dotnet test results
        path: ${{ runner.temp }}/TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: 'false'
    - name: PublishBuildArtifacts
      if: ${{ runner.os == 'Linux' }}
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: ${{ runner.temp }}/staging
        if-no-files-found: error
  Deploy_dev_Deploy:
    needs:
    - Build_Compile
    if: ${{ success() && ((github.event_name != 'workflow_dispatch' && true || inputs.deploy) == true) }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    container:
      image: node:20
    env:
      ENVNAME: dev
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        repository: contoso/infra
        ref: main
        path: infra
        token: ${{ secrets.CHECKOUT_TOKEN }}
        persist-credentials: false
    - name: Azure login (sub-dev)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Apply infra
      run: az deployment group create -g rg-${ENVNAME} -f ${GITHUB_WORKSPACE}/infra/main.bicep
      shell: bash
    - uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_AKS_DEV }}
    - name: KubernetesManifest
      uses: azure/k8s-deploy@v5
      with:
        action: deploy
        namespace: web
        manifests: manifests/*.yml
        images: myreg.azurecr.io/api:${{ github.run_id }}
    - name: Smoke test
      if: ${{ success() && (github.event_name != 'pull_request') }}
      run: |-
        if [ "${GITHUB_EVENT_NAME}" = "Manual" ]; then echo manual; fi
        curl -fsS https://example.com/health?v=${GITHUB_RUN_NUMBER}
      shell: bash
  Deploy_prod_Deploy:
    needs:
    - Build_Compile
    if: ${{ success() && ((github.event_name != 'workflow_dispatch' && true || inputs.deploy) == true) }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    container:
      image: node:20
    env:
      ENVNAME: prod
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        repository: contoso/infra
        ref: main
        path: infra
        token: ${{ secrets.CHECKOUT_TOKEN }}
        persist-credentials: false
    - name: Azure login (sub-prod)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Apply infra
      run: az deployment group create -g rg-${ENVNAME} -f ${GITHUB_WORKSPACE}/infra/main.bicep
      shell: bash
    - uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_AKS_PROD }}
    - name: KubernetesManifest
      uses: azure/k8s-deploy@v5
      with:
        action: deploy
        namespace: web
        manifests: manifests/*.yml
        images: myreg.azurecr.io/api:${{ github.run_id }}
    - name: Smoke test
      if: ${{ success() && (github.event_name != 'pull_request') }}
      run: |-
        if [ "${GITHUB_EVENT_NAME}" = "Manual" ]; then echo manual; fi
        curl -fsS https://example.com/health?v=${GITHUB_RUN_NUMBER}
      shell: bash
