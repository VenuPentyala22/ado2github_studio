name: Migrated job Deploy_Production_Smoke_Test
on:
  workflow_call:
    inputs:
      ado_inputs:
        type: string
        required: true
jobs:
  Deploy_Production_Smoke_Test:
    name: Validate deployed service
    runs-on: ubuntu-latest
    steps:
    - name: Run smoke test
      run: echo "Production deployment smoke test passed."
      shell: bash
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
env:
  VMIMAGE: ubuntu-latest
  SOURCEARTIFACTNAME: BuildOutput
  RELEASEARTIFACTNAME: ReleasePackage
  RELEASEDIRECTORY: ${{ github.workspace }}/release
  SYSTEM_DEBUG: 'false'
  BUILDCONFIGURATION: ${{ github.event_name != 'workflow_dispatch' && 'Release' || fromJSON(inputs.ado_inputs).buildConfiguration }}
