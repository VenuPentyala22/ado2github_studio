name: Migrated job PostDeploy_Verification_Deep_Verification
on:
  workflow_call:
    inputs:
      ado_inputs:
        type: string
        required: true
jobs:
  PostDeploy_Verification_Deep_Verification:
    name: Verify service health and business transaction
    runs-on: ubuntu-latest
    steps:
    - name: Run deep verification
      run: echo "Production deep verification passed."
      shell: bash
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
env:
  VMIMAGE: ubuntu-latest
  SOURCEARTIFACTNAME: BuildOutput
  RELEASEARTIFACTNAME: ReleasePackage
  RELEASEDIRECTORY: ${{ github.workspace }}/release
  SYSTEM_DEBUG: 'false'
  BUILDCONFIGURATION: ${{ github.event_name != 'workflow_dispatch' && 'Release' || fromJSON(inputs.ado_inputs).buildConfiguration }}
