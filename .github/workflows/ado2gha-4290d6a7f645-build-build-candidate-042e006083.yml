name: Migrated job Build_Build_Candidate
on:
  workflow_call:
    inputs:
      ado_inputs:
        type: string
        required: true
jobs:
  Build_Build_Candidate:
    name: Restore, compile, and stage candidate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
    - name: Fetch generated reusable actions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.workflow_sha }}
        path: .ado2gha-generated-4290d6a7f645
        sparse-checkout: .github/actions
        persist-credentials: false
    - name: Inspect available build toolchain
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
      uses: ./.ado2gha-generated-4290d6a7f645/.github/actions/ado2gha-setup-toolchain-b8647f18a39d
    - name: Build application
      run: |-
        set -euo pipefail

        if compgen -G "*.sln" > /dev/null; then
          dotnet restore
          dotnet build --configuration "${BUILDCONFIGURATION}" --no-restore
        elif [ -f package-lock.json ]; then
          npm ci
          npm run build --if-present
        elif [ -f package.json ]; then
          npm install
          npm run build --if-present
        elif [ -x scripts/build.sh ]; then
          scripts/build.sh
        else
          echo "No recognized build entry point found; packaging the repository as the candidate."
        fi
      shell: bash
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
    - name: Create immutable candidate directory
      run: |-
        set -euo pipefail
        out="${{ runner.temp }}/staging/candidate"
        mkdir -p "$out"
        tar --exclude=.git --exclude="${{ runner.temp }}/staging" -cf - . | tar -xf - -C "$out"
        printf '%s\n' "${GITHUB_SHA}" > "$out/COMMIT_SHA"
        printf '%s\n' "${GITHUB_RUN_NUMBER}" > "$out/BUILD_NUMBER"
      shell: bash
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
    - name: Publish build output
      uses: actions/upload-artifact@v4
      with:
        name: BuildOutput
        path: ${{ runner.temp }}/staging/candidate
        if-no-files-found: error
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
env:
  VMIMAGE: ubuntu-latest
  SOURCEARTIFACTNAME: BuildOutput
  RELEASEARTIFACTNAME: ReleasePackage
  RELEASEDIRECTORY: ${{ github.workspace }}/release
  SYSTEM_DEBUG: 'false'
  BUILDCONFIGURATION: ${{ github.event_name != 'workflow_dispatch' && 'Release' || fromJSON(inputs.ado_inputs).buildConfiguration }}
