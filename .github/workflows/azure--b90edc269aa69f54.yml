name: azure
on:
  workflow_dispatch:
    inputs:
      deployDev:
        description: Deploy to development
        type: boolean
        default: true
        required: false
      deployTest:
        description: Deploy to test
        type: boolean
        default: true
        required: false
      deployProd:
        description: Deploy to production
        type: boolean
        default: false
        required: false
      runSecurityScan:
        description: Run security scans
        type: boolean
        default: true
        required: false
      runTerraform:
        description: Deploy infrastructure
        type: boolean
        default: true
        required: false
      destroyInfrastructure:
        description: Destroy selected environment infrastructure
        type: boolean
        default: false
        required: false
      targetEnvironment:
        description: Target environment for manual execution
        type: choice
        options:
        - all
        - dev
        - test
        - prod
        default: all
        required: false
      terraformAction:
        description: Terraform action
        type: choice
        options:
        - plan
        - apply
        default: apply
        required: false
      imageTagOverride:
        description: Optional Docker image tag
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  VMIMAGE: ubuntu-latest
  APPLICATIONNAME: azure-platform-api
  BUILDCONFIGURATION: Release
  DOTNETVERSION: 8.x
  SOLUTIONPATH: src/AzurePlatform.sln
  TESTPROJECTS: tests/**/*.csproj
  DOCKERFILEPATH: ${{ github.workspace }}/Dockerfile
  DOCKERBUILDCONTEXT: ${{ github.workspace }}
  CONTAINERREGISTRYSERVICECONNECTION: sc-acr-platform
  CONTAINERREGISTRYNAME: contosoplatformacr
  CONTAINERREGISTRYLOGINSERVER: contosoplatformacr.azurecr.io
  IMAGEREPOSITORY: azure-platform-api
  ARTIFACTNAME: deployment-package
  TERRAFORMVERSION: 1.9.8
  TERRAFORMROOT: ${{ github.workspace }}/infrastructure/terraform
  MANIFESTROOT: ${{ github.workspace }}/manifests
  SONARPROJECTKEY: azure-platform-api
  HELMCHARTPATH: ${{ github.workspace }}/charts/azure-platform-api
  IMAGETAG: ${{ github.run_id }}
jobs:
  Validate_ValidateSource:
    name: Validate application, YAML and Terraform
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    - name: Restore and validate code formatting
      run: |2-

        set -euo pipefail



        echo "Build reason: ${GITHUB_EVENT_NAME}"

        echo "Source branch: ${GITHUB_REF}"

        echo "Commit: ${GITHUB_SHA}"

        echo "Image tag: ${IMAGETAG}"



        dotnet --info

        dotnet restore "${SOLUTIONPATH}"

        dotnet format "${SOLUTIONPATH}" \

          --verify-no-changes \

          --verbosity diagnostic
      shell: bash
    - name: Validate Kubernetes and application YAML
      run: |2-

        set -euo pipefail



        python3 - <<'PYTHON'

        import pathlib

        import sys

        import yaml



        yaml_files = list(pathlib.Path(".").rglob("*.yml"))

        yaml_files += list(pathlib.Path(".").rglob("*.yaml"))



        excluded = {

            pathlib.Path("azure-pipelines.yml")

        }



        failed = False



        for yaml_file in yaml_files:

            if yaml_file in excluded:

                continue



            try:

                with yaml_file.open("r", encoding="utf-8") as handle:

                    list(yaml.safe_load_all(handle))

                print(f"Validated: {yaml_file}")

            except Exception as exc:

                failed = True

                print(f"Invalid YAML: {yaml_file}: {exc}")



        if failed:

            sys.exit(1)

        PYTHON
      shell: bash
    - name: Validate Terraform formatting
      run: |2-

        set -euo pipefail



        terraform fmt \

          -check \

          -recursive \

          -diff "${TERRAFORMROOT}"
      shell: bash
  Build_BuildApplication:
    name: Build application
    needs:
    - Validate_ValidateSource
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
        path: ${{ vars.HOME }}/.nuget/packages
        restore-keys: |-
          nuget-${{ runner.os }}-
          nuget-
    - name: Restore and build
      run: |2-

        set -euo pipefail



        dotnet restore "${SOLUTIONPATH}"



        dotnet build "${SOLUTIONPATH}" \

          --configuration "${BUILDCONFIGURATION}" \

          --no-restore \

          /p:TreatWarningsAsErrors=true
      shell: bash
    - name: Run unit and integration tests
      run: |2-

        set -euo pipefail



        dotnet test "${SOLUTIONPATH}" \

          --configuration "${BUILDCONFIGURATION}" \

          --no-build \

          --logger "trx;LogFileName=unit-tests.trx" \

          --collect "XPlat Code Coverage" \

          --results-directory "${RUNNER_TEMP}/TestResults" \

          /p:CollectCoverage=true \

          /p:CoverletOutputFormat=cobertura
      shell: bash
    - name: Publish test results
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v1
      with:
        name: azure-platform-api-${{ github.run_number }}
        path: ${{ runner.temp }}/TestResults/**/*.trx
        reporter: dotnet-trx
        fail-on-error: 'false'
    - name: Publish code coverage
      if: ${{ success() || failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: ${{ runner.temp }}/TestResults/**/coverage.cobertura.xml
        if-no-files-found: error
    - name: Publish application
      run: |2-

        set -euo pipefail



        mkdir -p "${{ runner.temp }}/staging/application"



        dotnet publish "${SOLUTIONPATH}" \

          --configuration "${BUILDCONFIGURATION}" \

          --no-build \

          --output "${{ runner.temp }}/staging/application"
      shell: bash
    - name: Prepare deployment package
      run: |2-

        set -euo pipefail



        mkdir -p "${{ runner.temp }}/staging/deployment"



        cp -R "${MANIFESTROOT}" \

          "${{ runner.temp }}/staging/deployment/manifests"



        cp -R "${TERRAFORMROOT}" \

          "${{ runner.temp }}/staging/deployment/terraform"



        if [ -d "${HELMCHARTPATH}" ]; then

          cp -R "${HELMCHARTPATH}" \

            "${{ runner.temp }}/staging/deployment/chart"

        fi
      shell: bash
    - name: Publish application artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: ${{ runner.temp }}/staging
        if-no-files-found: error
  Security_SecurityScanning:
    name: Scan source, dependencies and container
    needs:
    - Build_BuildApplication
    if: ${{ success() && ((github.event_name != 'workflow_dispatch' && true || inputs.runSecurityScan) == true) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    - name: Scan NuGet dependencies
      run: |2-

        set -euo pipefail



        dotnet restore "${SOLUTIONPATH}"



        echo "Checking vulnerable NuGet packages..."



        dotnet list "${SOLUTIONPATH}" package \

          --vulnerable \

          --include-transitive | tee package-vulnerabilities.txt



        if grep -Eqi "Critical|High" package-vulnerabilities.txt; then

          echo "Critical or high dependency vulnerability detected."

          exit 1

        fi
      shell: bash
    - name: Run secret scan with Gitleaks
      run: |2-

        set -euo pipefail



        echo "Scanning repository for possible secrets..."



        docker run --rm \

          -v "${GITHUB_WORKSPACE}:/repository" \

          zricethezav/gitleaks:latest \

          detect \

          --source="/repository" \

          --no-git \

          --verbose
      shell: bash
    - name: Run Checkov infrastructure scan
      run: |2-

        set -euo pipefail



        echo "Running Terraform security scan..."



        docker run --rm \

          -v "${TERRAFORMROOT}:/tf" \

          bridgecrew/checkov:latest \

          --directory /tf \

          --framework terraform \

          --compact \

          --quiet \

          --soft-fail false
      shell: bash
  Container_BuildContainer:
    name: Build and push application image
    needs:
    - Build_BuildApplication
    - Security_SecurityScanning
    if: ${{ success() && (needs.Security_SecurityScanning.result == 'Succeeded' || needs.Security_SecurityScanning.result == 'Skipped') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Sign in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.SC_ACR_PLATFORM_REGISTRY_SERVER }}
        username: ${{ secrets.SC_ACR_PLATFORM_REGISTRY_USERNAME }}
        password: ${{ secrets.SC_ACR_PLATFORM_REGISTRY_PASSWORD }}
    - name: Build and push Docker image
      run: |2-

        set -euo pipefail



        FULL_IMAGE="${CONTAINERREGISTRYLOGINSERVER}/${IMAGEREPOSITORY}:${IMAGETAG}"

        LATEST_IMAGE="${CONTAINERREGISTRYLOGINSERVER}/${IMAGEREPOSITORY}:latest"



        echo "Building image: ${FULL_IMAGE}"



        docker build \

          --file "${DOCKERFILEPATH}" \

          --tag "${FULL_IMAGE}" \

          --tag "${LATEST_IMAGE}" \

          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \

          --label "org.opencontainers.image.version=${GITHUB_RUN_NUMBER}" \

          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \

          "${DOCKERBUILDCONTEXT}"



        docker push "${FULL_IMAGE}"



        if [ "${GITHUB_REF}" = "refs/heads/main" ]; then

          docker push "${LATEST_IMAGE}"

        fi
      shell: bash
    - name: Scan container image
      if: ${{ success() && ((github.event_name != 'workflow_dispatch' && true || inputs.runSecurityScan) == true) }}
      run: |2-

        set -euo pipefail



        FULL_IMAGE="${CONTAINERREGISTRYLOGINSERVER}/${IMAGEREPOSITORY}:${IMAGETAG}"



        echo "Scanning ${FULL_IMAGE}"



        docker run --rm \

          -v /var/run/docker.sock:/var/run/docker.sock \

          aquasec/trivy:latest \

          image \

          --exit-code 1 \

          --severity CRITICAL,HIGH \

          --ignore-unfixed \

          "${FULL_IMAGE}"
      shell: bash
    - name: Generate image metadata
      run: |2-

        set -euo pipefail



        mkdir -p "${{ runner.temp }}/staging/metadata"



        cat > "${{ runner.temp }}/staging/metadata/image-metadata.json" <<EOF

        {

          "application": "${APPLICATIONNAME}",

          "registry": "${CONTAINERREGISTRYLOGINSERVER}",

          "repository": "${IMAGEREPOSITORY}",

          "tag": "${IMAGETAG}",

          "buildNumber": "${GITHUB_RUN_NUMBER}",

          "buildId": "${GITHUB_RUN_ID}",

          "commit": "${GITHUB_SHA}",

          "branch": "${GITHUB_REF}"

        }

        EOF
      shell: bash
    - name: Publish image metadata
      uses: actions/upload-artifact@v4
      with:
        name: image-metadata
        path: ${{ runner.temp }}/staging/metadata
        if-no-files-found: error
  DeployDev_InfrastructureDev:
    name: Deploy development infrastructure
    needs:
    - Container_BuildContainer
    if: ${{ (success() && ((github.event_name != 'workflow_dispatch' && true || inputs.deployDev) == true) && (((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'all') || ((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'dev')) && (github.event_name != 'pull_request')) && (success() && ((github.event_name != 'workflow_dispatch' && true || inputs.runTerraform) == true)) }}
    runs-on: ubuntu-latest
    environment: app-dev
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENTNAME: dev
      AZURESERVICECONNECTION: sc-azure-dev
      RESOURCEGROUPNAME: rg-platform-dev
      AKSCLUSTERNAME: aks-platform-dev
      KUBERNETESNAMESPACE: platform-dev
      TERRAFORMBACKENDRESOURCEGROUP: rg-platform-tfstate
      TERRAFORMBACKENDSTORAGEACCOUNT: stplatformtfstate001
      TERRAFORMBACKENDCONTAINER: tfstate
      TERRAFORMSTATEKEY: platform-dev.tfstate
      REPLICACOUNT: '1'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Azure login (sc-azure-dev)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Terraform init, validate, plan and apply
      run: |2-

        set -euo pipefail



        cd "${TERRAFORMROOT}"



        export ARM_CLIENT_ID="${servicePrincipalId}"

        export ARM_CLIENT_SECRET="${servicePrincipalKey}"

        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

        export ARM_TENANT_ID="${tenantId}"



        terraform init \

          -backend-config="resource_group_name=${TERRAFORMBACKENDRESOURCEGROUP}" \

          -backend-config="storage_account_name=${TERRAFORMBACKENDSTORAGEACCOUNT}" \

          -backend-config="container_name=${TERRAFORMBACKENDCONTAINER}" \

          -backend-config="key=${TERRAFORMSTATEKEY}"



        terraform validate



        terraform plan \

          -var-file="environments/${ENVIRONMENTNAME}.tfvars" \

          -out="${GITHUB_WORKSPACE}/${ENVIRONMENTNAME}.tfplan"



        if [ "${{ github.event_name != 'workflow_dispatch' && 'apply' || inputs.terraformAction }}" = "apply" ]; then

          if [ "${{ inputs.destroyInfrastructure }}" = "true" ]; then

            terraform destroy \

              -var-file="environments/${ENVIRONMENTNAME}.tfvars" \

              -auto-approve

          else

            terraform apply \

              -auto-approve \

              "${GITHUB_WORKSPACE}/${ENVIRONMENTNAME}.tfplan"

          fi

        fi
      shell: bash
  DeployDev_ApplicationDev:
    name: Deploy application to development
    needs:
    - Container_BuildContainer
    - DeployDev_InfrastructureDev
    if: ${{ (success() && ((github.event_name != 'workflow_dispatch' && true || inputs.deployDev) == true) && (((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'all') || ((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'dev')) && (github.event_name != 'pull_request')) && (success() && (inputs.destroyInfrastructure == false)) }}
    runs-on: ubuntu-latest
    environment: app-dev
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENTNAME: dev
      AZURESERVICECONNECTION: sc-azure-dev
      RESOURCEGROUPNAME: rg-platform-dev
      AKSCLUSTERNAME: aks-platform-dev
      KUBERNETESNAMESPACE: platform-dev
      TERRAFORMBACKENDRESOURCEGROUP: rg-platform-tfstate
      TERRAFORMBACKENDSTORAGEACCOUNT: stplatformtfstate001
      TERRAFORMBACKENDCONTAINER: tfstate
      TERRAFORMSTATEKEY: platform-dev.tfstate
      REPLICACOUNT: '1'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Azure login (sc-azure-dev)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Connect to development AKS
      run: |2-

        set -euo pipefail



        az aks get-credentials \

          --resource-group "${RESOURCEGROUPNAME}" \

          --name "${AKSCLUSTERNAME}" \

          --overwrite-existing



        kubectl create namespace "${KUBERNETESNAMESPACE}" \

          --dry-run=client \

          -o yaml | kubectl apply -f -
      shell: bash
    - name: Deploy development application
      run: |2-

        set -euo pipefail



        IMAGE="${CONTAINERREGISTRYLOGINSERVER}/${IMAGEREPOSITORY}:${IMAGETAG}"



        kubectl apply \

          -f "${MANIFESTROOT}/base" \

          -n "${KUBERNETESNAMESPACE}"



        kubectl set image \

          deployment/${APPLICATIONNAME} \

          ${APPLICATIONNAME}="${IMAGE}" \

          -n "${KUBERNETESNAMESPACE}"



        kubectl scale \

          deployment/${APPLICATIONNAME} \

          --replicas="${REPLICACOUNT}" \

          -n "${KUBERNETESNAMESPACE}"



        kubectl rollout status \

          deployment/${APPLICATIONNAME} \

          -n "${KUBERNETESNAMESPACE}" \

          --timeout=300s
      shell: bash
    - name: Run development smoke test
      run: |2-

        set -euo pipefail



        kubectl run smoke-test-${GITHUB_RUN_ID} \

          --rm \

          --restart=Never \

          --image=curlimages/curl:latest \

          --namespace="${KUBERNETESNAMESPACE}" \

          -- \

          curl \

          --fail \

          --retry 10 \

          --retry-delay 5 \

          "http://${APPLICATIONNAME}/health"
      shell: bash
  DeployTest_InfrastructureTest:
    name: Deploy test infrastructure
    needs:
    - DeployDev_InfrastructureDev
    - DeployDev_ApplicationDev
    - Container_BuildContainer
    if: ${{ (needs.Container_BuildContainer.result == 'Succeeded') && ((needs.DeployDev_InfrastructureDev.result == 'success' && needs.DeployDev_ApplicationDev.result == 'success') == 'Succeeded' || (needs.DeployDev_InfrastructureDev.result == 'success' && needs.DeployDev_ApplicationDev.result == 'success') == 'Skipped') && ((github.event_name != 'workflow_dispatch' && true || inputs.deployTest) == true) && (((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'all') || ((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'test')) && (github.event_name != 'pull_request') && ((github.ref == 'refs/heads/develop') || (github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
