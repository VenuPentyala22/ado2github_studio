  DeployProd_InfrastructureProd:
    name: Deploy production infrastructure
    needs:
    - DeployTest_InfrastructureTest
    - DeployTest_ApplicationTest
    - Container_BuildContainer
    if: ${{ success() && (inputs.deployProd == true) && (((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'all') || ((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'prod')) && (github.event_name != 'pull_request') && ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    environment: app-prod
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENTNAME: prod
      AZURESERVICECONNECTION: sc-azure-prod
      RESOURCEGROUPNAME: rg-platform-prod
      AKSCLUSTERNAME: aks-platform-prod
      KUBERNETESNAMESPACE: platform-prod
      TERRAFORMBACKENDRESOURCEGROUP: rg-platform-tfstate
      TERRAFORMBACKENDSTORAGEACCOUNT: stplatformtfstate001
      TERRAFORMBACKENDCONTAINER: tfstate
      TERRAFORMSTATEKEY: platform-prod.tfstate
      REPLICACOUNT: '4'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Azure login (sc-azure-prod)
      if: ${{ success() && ((github.event_name != 'workflow_dispatch' && true || inputs.runTerraform) == true) }}
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Execute production Terraform deployment
      if: ${{ success() && ((github.event_name != 'workflow_dispatch' && true || inputs.runTerraform) == true) }}
      run: |2-

        set -euo pipefail



        cd "${TERRAFORMROOT}"



        export ARM_CLIENT_ID="${servicePrincipalId}"

        export ARM_CLIENT_SECRET="${servicePrincipalKey}"

        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

        export ARM_TENANT_ID="${tenantId}"



        terraform init \

          -backend-config="resource_group_name=${TERRAFORMBACKENDRESOURCEGROUP}" \

          -backend-config="storage_account_name=${TERRAFORMBACKENDSTORAGEACCOUNT}" \

          -backend-config="container_name=${TERRAFORMBACKENDCONTAINER}" \

          -backend-config="key=${TERRAFORMSTATEKEY}"



        terraform plan \

          -var-file="environments/${ENVIRONMENTNAME}.tfvars" \

          -out="${GITHUB_WORKSPACE}/${ENVIRONMENTNAME}.tfplan"



        terraform apply \

          -auto-approve \

          "${GITHUB_WORKSPACE}/${ENVIRONMENTNAME}.tfplan"
      shell: bash
  DeployProd_ApplicationProd:
    name: Production canary deployment
    needs:
    - DeployTest_InfrastructureTest
    - DeployTest_ApplicationTest
    - Container_BuildContainer
    - DeployProd_InfrastructureProd
    if: ${{ success() && (inputs.deployProd == true) && (((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'all') || ((github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment) == 'prod')) && (github.event_name != 'pull_request') && ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    environment: app-prod
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENTNAME: prod
      AZURESERVICECONNECTION: sc-azure-prod
      RESOURCEGROUPNAME: rg-platform-prod
      AKSCLUSTERNAME: aks-platform-prod
      KUBERNETESNAMESPACE: platform-prod
      TERRAFORMBACKENDRESOURCEGROUP: rg-platform-tfstate
      TERRAFORMBACKENDSTORAGEACCOUNT: stplatformtfstate001
      TERRAFORMBACKENDCONTAINER: tfstate
      TERRAFORMSTATEKEY: platform-prod.tfstate
      REPLICACOUNT: '4'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Azure login (sc-azure-prod)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Connect to production AKS
      run: |2-

        set -euo pipefail



        az aks get-credentials \

          --resource-group "${RESOURCEGROUPNAME}" \

          --name "${AKSCLUSTERNAME}" \

          --overwrite-existing



        kubectl get nodes

        kubectl get pods -n "${KUBERNETESNAMESPACE}"
      shell: bash
    - name: Deploy production image
      run: |2-

        set -euo pipefail



        IMAGE="${CONTAINERREGISTRYLOGINSERVER}/${IMAGEREPOSITORY}:${IMAGETAG}"



        kubectl apply \

          -f "${MANIFESTROOT}/base" \

          -n "${KUBERNETESNAMESPACE}"



        kubectl set image \

          deployment/${APPLICATIONNAME} \

          ${APPLICATIONNAME}="${IMAGE}" \

          -n "${KUBERNETESNAMESPACE}"



        kubectl annotate \

          deployment/${APPLICATIONNAME} \

          "azure-pipelines/build=${GITHUB_RUN_NUMBER}" \

          "azure-pipelines/commit=${GITHUB_SHA}" \

          --overwrite \

          -n "${KUBERNETESNAMESPACE}"
      shell: bash
    - name: Route canary traffic
      run: |2-

        set -euo pipefail



        echo "Canary increment: $(strategy.increment)%"

        echo "Configure ingress or service mesh traffic here."



        kubectl rollout status \

          deployment/${APPLICATIONNAME} \

          -n "${KUBERNETESNAMESPACE}" \

          --timeout=300s
      shell: bash
    - name: Validate canary deployment
      run: |2-

        set -euo pipefail



        kubectl run prod-smoke-${GITHUB_RUN_ID}-$(strategy.increment) \

          --rm \

          --restart=Never \

          --image=curlimages/curl:latest \

          --namespace="${KUBERNETESNAMESPACE}" \

          -- \

          curl \

          --fail \

          --retry 10 \

          --retry-delay 5 \

          "http://${APPLICATIONNAME}/health"
      shell: bash
    - name: Rollback production deployment
      if: ${{ failure() }}
      run: |2-

        set -euo pipefail



        echo "Production validation failed."

        echo "Rolling back to the previous deployment revision."



        kubectl rollout undo \

          deployment/${APPLICATIONNAME} \

          -n "${KUBERNETESNAMESPACE}"



        kubectl rollout status \

          deployment/${APPLICATIONNAME} \

          -n "${KUBERNETESNAMESPACE}" \

          --timeout=300s
      shell: bash
    - name: Complete production rollout
      run: |2-

        set -euo pipefail



        kubectl scale \

          deployment/${APPLICATIONNAME} \

          --replicas="${REPLICACOUNT}" \

          -n "${KUBERNETESNAMESPACE}"



        kubectl rollout status \

          deployment/${APPLICATIONNAME} \

          -n "${KUBERNETESNAMESPACE}" \

          --timeout=300s



        echo "Production deployment completed successfully."

        echo "Image: ${CONTAINERREGISTRYLOGINSERVER}/${IMAGEREPOSITORY}:${IMAGETAG}"
      shell: bash
  Report_GenerateReport:
    name: Generate pipeline summary
    needs:
    - Validate_ValidateSource
    - Build_BuildApplication
    - Security_SecurityScanning
    - Container_BuildContainer
    - DeployDev_InfrastructureDev
    - DeployDev_ApplicationDev
    - DeployTest_InfrastructureTest
    - DeployTest_ApplicationTest
    - DeployProd_InfrastructureProd
    - DeployProd_ApplicationProd
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Create deployment summary
      run: |2-

        set -euo pipefail



        mkdir -p "${{ runner.temp }}/staging/report"



        cat > "${{ runner.temp }}/staging/report/deployment-summary.md" <<EOF

        # Deployment Summary



        - Application: ${APPLICATIONNAME}

        - Build number: ${GITHUB_RUN_NUMBER}

        - Build ID: ${GITHUB_RUN_ID}

        - Source branch: ${GITHUB_REF}

        - Commit: ${GITHUB_SHA}

        - Build reason: ${GITHUB_EVENT_NAME}

        - Docker image: ${CONTAINERREGISTRYLOGINSERVER}/${IMAGEREPOSITORY}:${IMAGETAG}

        - Requested environment: ${{ github.event_name != 'workflow_dispatch' && 'all' || inputs.targetEnvironment }}

        - Terraform action: ${{ github.event_name != 'workflow_dispatch' && 'apply' || inputs.terraformAction }}

        - Security scanning: ${{ github.event_name != 'workflow_dispatch' && true || inputs.runSecurityScan }}

        - Production deployment requested: ${{ inputs.deployProd }}

        EOF



        cat "${{ runner.temp }}/staging/report/deployment-summary.md"
      shell: bash
    - name: Publish deployment report
      uses: actions/upload-artifact@v4
      with:
        name: deployment-report
        path: ${{ runner.temp }}/staging/report
        if-no-files-found: error
    - name: Add report to pipeline summary
      run: |2-

        echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=Deployment Summary;]${{ runner.temp }}/staging/report/deployment-summary.md"
      shell: bash
