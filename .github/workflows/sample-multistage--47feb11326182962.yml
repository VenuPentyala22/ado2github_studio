name: sample-multistage
on:
  workflow_dispatch:
    inputs:
      environment:
        description: environment
        type: choice
        options:
        - dev
        - prod
        default: dev
        required: false
      runTests:
        description: runTests
        type: boolean
        default: true
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BUILDCONFIGURATION: Release
  SUPPORTEMAIL: ${{ vars.SUPPORTEMAIL }}
jobs:
  Build_BuildJob:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      ver: ${{ steps.setver.outputs.ver }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: UseDotNet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build
      id: setver
      run: |-
        echo "building ${BUILDCONFIGURATION} on ${GITHUB_RUN_ID}"
        echo "ver=1.2.3" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: ${{ github.event_name != 'workflow_dispatch' && true || inputs.runTests }}
      run: dotnet test tests/App.Tests.csproj --logger trx --results-directory "${{ runner.temp }}/TestResults"
    - name: dotnet test results
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v1
      with:
        name: dotnet test results
        path: ${{ runner.temp }}/TestResults/*.trx
        reporter: dotnet-trx
        fail-on-error: 'false'
    - uses: actions/upload-artifact@v4
      with:
        name: drop
        path: ${{ runner.temp }}/staging
        if-no-files-found: error
  Deploy_DeployWeb:
    needs:
    - Build_BuildJob
    if: ${{ success() && (github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      VER: ${{ needs.Build_BuildJob.outputs.ver }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}
    - name: Azure login (my-azure-conn)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: AzureWebApp
      uses: azure/webapps-deploy@v3
      with:
        app-name: mywebapp
        package: ${{ github.workspace }}/drop/*.zip
    - name: 'TODO: manual migration required for SomeUnknownTask@1'
      run: |-
        echo "::warning::Azure Pipelines task SomeUnknownTask@1 has no known GitHub Actions equivalent and was not migrated automatically."
        exit 1
      shell: bash
