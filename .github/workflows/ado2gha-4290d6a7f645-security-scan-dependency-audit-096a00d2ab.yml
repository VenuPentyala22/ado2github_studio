name: Migrated job Security_Scan_Dependency_Audit
on:
  workflow_call:
    inputs:
      ado_inputs:
        type: string
        required: true
jobs:
  Security_Scan_Dependency_Audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
    - name: Fetch generated reusable actions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.workflow_sha }}
        path: .ado2gha-generated-4290d6a7f645
        sparse-checkout: .github/actions
        persist-credentials: false
    - name: Inspect available build toolchain
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
      uses: ./.ado2gha-generated-4290d6a7f645/.github/actions/ado2gha-setup-toolchain-b8647f18a39d
    - name: Reject high and critical dependency findings
      run: |-
        set -euo pipefail

        if [ -f package-lock.json ]; then
          npm ci
          npm audit --audit-level=high
        fi

        if compgen -G "*.sln" > /dev/null; then
          report="${RUNNER_TEMP}/dotnet-vulnerabilities.txt"
          dotnet list package --vulnerable --include-transitive | tee "$report"
          if grep -Eiq '(High|Critical)' "$report"; then
            echo "High or critical .NET vulnerability detected."
            exit 1
          fi
        fi

        echo "Dependency audit completed."
      shell: bash
      env:
        TESTRESULTSDIRECTORY: ${{ runner.temp }}/test-results
env:
  VMIMAGE: ubuntu-latest
  SOURCEARTIFACTNAME: BuildOutput
  RELEASEARTIFACTNAME: ReleasePackage
  RELEASEDIRECTORY: ${{ github.workspace }}/release
  SYSTEM_DEBUG: 'false'
  BUILDCONFIGURATION: ${{ github.event_name != 'workflow_dispatch' && 'Release' || fromJSON(inputs.ado_inputs).buildConfiguration }}
